schema_version: '1.1'
name: h-op-deploys
tags:
- trigger
runs: 3
execution:
  prompt: Our deploys keep causing brief outages. How can we make releases safer?
  max_turns: 3
  timeout_seconds: 120
  allowed_tools:
  - Skill
graders:
- name: skill-fired
  type: tool_used
  tool: Skill
  input_match: operability-guidelines
  arm: both
