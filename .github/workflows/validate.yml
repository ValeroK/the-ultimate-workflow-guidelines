name: Validate manifests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Hook gate unit tests
        # The glob is quoted so Node expands it, not the shell -- identical on
        # Windows and Linux. `node --test hooks/` does NOT work: a directory
        # argument is resolved as a module path, not a search root.
        # Plugin payload lives under .cursor-plugin/ultimate-workflow/ so Cursor
        # marketplace sparse-checkout materializes it (see memory/cursor-install.md).
        run: node --test ".cursor-plugin/ultimate-workflow/hooks/**/*.test.js" "evals/**/*.test.js" mirrors.test.js

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JSON syntax check
        run: |
          set -e
          for f in \
            .cursor-plugin/ultimate-workflow/.claude-plugin/plugin.json \
            .cursor-plugin/ultimate-workflow/.cursor-plugin/plugin.json \
            .claude-plugin/marketplace.json \
            .cursor-plugin/marketplace.json; do
            echo "Checking $f"
            python -m json.tool "$f" > /dev/null
          done

      - name: Manifest version consistency
        run: |
          set -e
          CANON=$(jq -r '.version' .cursor-plugin/ultimate-workflow/.claude-plugin/plugin.json)
          echo "Canonical version (.claude-plugin/plugin.json): $CANON"

          CURSOR=$(jq -r '.version' .cursor-plugin/ultimate-workflow/.cursor-plugin/plugin.json)
          MKT_META=$(jq -r '.metadata.version' .claude-plugin/marketplace.json)
          MKT_PLUGIN=$(jq -r '.plugins[0].version' .claude-plugin/marketplace.json)
          CURSOR_MKT=$(jq -r '.plugins[0].version' .cursor-plugin/marketplace.json)

          fail=0
          for pair in \
            ".cursor-plugin/plugin.json:$CURSOR" \
            ".claude-plugin/marketplace.json#metadata.version:$MKT_META" \
            ".claude-plugin/marketplace.json#plugins[0].version:$MKT_PLUGIN" \
            ".cursor-plugin/marketplace.json#plugins[0].version:$CURSOR_MKT"; do
            label="${pair%%:*}"
            value="${pair##*:}"
            if [ "$value" != "$CANON" ]; then
              echo "::error::Version mismatch at $label: got '$value', expected '$CANON'"
              fail=1
            fi
          done

          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
          echo "All version slots agree on $CANON."

      - name: Manifest name consistency
        # The plugin name namespaces every skill, command, and workflow it
        # ships, so a mismatch silently changes how users invoke them.
        # The marketplace's own top-level name is deliberately NOT checked:
        # it identifies the marketplace, not the plugin.
        run: |
          set -e
          CANON=$(jq -r '.name' .cursor-plugin/ultimate-workflow/.claude-plugin/plugin.json)
          echo "Canonical plugin name: $CANON"

          CURSOR=$(jq -r '.name' .cursor-plugin/ultimate-workflow/.cursor-plugin/plugin.json)
          MKT=$(jq -r '.plugins[0].name' .claude-plugin/marketplace.json)
          CURSOR_MKT=$(jq -r '.plugins[0].name' .cursor-plugin/marketplace.json)

          fail=0
          for pair in \
            ".cursor-plugin/plugin.json:$CURSOR" \
            ".claude-plugin/marketplace.json#plugins[0].name:$MKT" \
            ".cursor-plugin/marketplace.json#plugins[0].name:$CURSOR_MKT"; do
            label="${pair%%:*}"
            value="${pair##*:}"
            if [ "$value" != "$CANON" ]; then
              echo "::error::Name mismatch at $label: got '$value', expected '$CANON'"
              fail=1
            fi
          done

          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
          echo "All plugin name slots agree on $CANON."
