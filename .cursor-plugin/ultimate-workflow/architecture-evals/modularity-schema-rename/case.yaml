schema_version: '1.1'
name: modularity-schema-rename
tags:
- quality
- modularity
- migration
runs: 2
execution:
  prompt: In production we need to rename the column amount to total_amount in the orders table. Three different services read it. Just give me the migration.
  max_turns: 6
  timeout_seconds: 240
  allowed_tools:
  - Skill
graders:
- name: expand-contract
  type: regex
  pattern: expand|contract|parallel change|backfill|dual.write|add the new column
  flags: i
  match: contains
  target: last_message
- name: skill-fired
  type: tool_used
  tool: Skill
  input_match: modularity-and-evolution-guidelines
