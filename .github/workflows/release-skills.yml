name: Build and publish skill ZIPs

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v2.6.0). Built from the tag if it exists; otherwise created at "target".'
        required: false
      target:
        description: 'Branch or SHA to create the tag from when it does not exist yet.'
        required: false
        default: 'main'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve ref
        id: ref
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IN_TAG: ${{ inputs.tag }}
          IN_TARGET: ${{ inputs.target }}
        run: |
          set -e
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$IN_TAG" ]; then
            TAG="$IN_TAG"
            if gh api "repos/${{ github.repository }}/git/ref/tags/$TAG" >/dev/null 2>&1; then
              # Tag already exists: build from it, let gh infer the target.
              REF="$TAG"
              TARGET=""
            else
              # Tag does not exist yet: build from the target branch/SHA and
              # have `gh release create --target` mint the tag there.
              REF="${IN_TARGET:-main}"
              TARGET="${IN_TARGET:-main}"
            fi
          else
            TAG="${{ github.ref_name }}"
            REF="${{ github.ref_name }}"
            TARGET=""
          fi

          # Guard: the release name doubles as the tag name, so a stray
          # dispatch must never publish a release called "main".
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "::error::Refusing to release '$TAG' - tag must look like v<version>"; exit 1 ;;
          esac

          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG from ${TARGET:-$REF}"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref }}

      - name: Build per-skill ZIPs
        run: |
          mkdir -p dist
          cd .cursor-plugin/ultimate-workflow/skills
          zip -r ../../../dist/the-ultimate-workflow-guidelines.zip the-ultimate-workflow-guidelines
          zip -r ../../../dist/project-bootstrap-guidelines.zip project-bootstrap-guidelines

      - name: Build full-plugin ZIP (dual Claude + Cursor)
        # Zip the nested plugin directory so the archive root is the plugin
        # root (.*-plugin/plugin.json siblings with skills/rules/agents).
        # That is also the tree Cursor marketplace sparse-checkout keeps
        # when the source points here — see memory/cursor-install.md.
        run: |
          cd .cursor-plugin/ultimate-workflow
          zip -r ../../dist/the-ultimate-workflow-guidelines-plugin.zip . \
            -x 'fixtures/*'
          ls -la ../../dist/

      - name: Fail if the plugin ZIP has grown past what a plugin should be
        # research/new-sdlc-with-vibe-coding.pdf is 9.97 MB of a 10.6 MB repo,
        # and for one release it shipped inside this ZIP -- the file Claude
        # Desktop and offline Cursor users download -- taking it from under 1 MB
        # to roughly 10 MB for a third-party binary no skill, workflow, hook or
        # test reads. Only its 9 KB summary is indexed. Nobody noticed because
        # nothing looked at the size.
        run: |
          BYTES=$(stat -c%s dist/the-ultimate-workflow-guidelines-plugin.zip)
          echo "Plugin ZIP: $BYTES bytes"
          if [ "$BYTES" -gt 2000000 ]; then
            echo "::error::Plugin ZIP is $BYTES bytes, over the 2 MB ceiling. Something large was added to the plugin payload; exclude it above or keep it out of .cursor-plugin/ultimate-workflow/."
            exit 1
          fi

      - name: Upload to GitHub Release (create if missing)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.ref.outputs.tag }}"
          TARGET="${{ steps.ref.outputs.target }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            if [ -n "$TARGET" ]; then
              # Creates the tag at $TARGET as a side effect.
              gh release create "$TAG" --title "$TAG" --generate-notes --target "$TARGET"
            else
              gh release create "$TAG" --title "$TAG" --generate-notes
            fi
          fi
          gh release upload "$TAG" \
            dist/the-ultimate-workflow-guidelines-plugin.zip \
            dist/the-ultimate-workflow-guidelines.zip \
            dist/project-bootstrap-guidelines.zip \
            --clobber
